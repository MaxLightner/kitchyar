plugins { id 'com.android.application' }
android {
    namespace 'ir.kitchyar'
    compileSdk 35
    defaultConfig { applicationId 'ir.kitchyar'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0-alpha' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs += [file('../../preview')] } }
}
