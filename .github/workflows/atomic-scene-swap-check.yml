name: Atomic kitchen scene swap regression
on:
  push:
    branches: [fix/atomic-scene-swap-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Install JPEG encoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: TypeScript
        run: bun run lint
      - name: Deferred scene and equipment regression
        run: bunx tsx --test src/utils/deferredSceneSwap.test.ts src/cad/kitchenOcclusion.test.ts src/cad/cooktopMount.test.ts
      - name: Production build
        run: bun run build
