name: Diagnose application startup
on:
  push:
    branches: [verify/startup-20261119]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: npm install --prefix /tmp/kitchyar-browser playwright@1.56.1
      - name: Check editor in Chromium
        run: |
          bun run preview --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/kitchyar/ >/dev/null && break; sleep 1; done
          cat > /tmp/startup.cjs <<'JS'
          const { chromium } = require('/tmp/kitchyar-browser/node_modules/playwright');
          (async () => {
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage();
          let errors=[];
          page.on('pageerror',e=>{errors.push(e.message);console.log('PAGEERROR',e.stack)});
          page.on('console',m=>{if(m.type()==='error'){console.log('CONSOLE',m.text().slice(0,2000));if(/THREE|shader|ReferenceError/.test(m.text()))errors.push(m.text());}});
          const origin=process.env.TEST_ORIGIN||'http://127.0.0.1:4173/kitchyar/';
          await page.goto(origin,{waitUntil:'networkidle'});
          console.log('WELCOME_OK', (await page.locator('body').innerText()).includes('ادامه آخرین پروژه'));
          await page.goto(origin+'?autostart=1',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:'تنظیمات استاندارد پروژه',exact:true}).click();
          await page.getByLabel('نور دوربین',{exact:true}).fill('0.4');
          await page.getByRole('button',{name:'ذخیره و اعمال',exact:true}).click();
          console.log('LIGHT_SETTINGS_OK');
          await page.getByLabel('نمای سه‌بعدی',{exact:true}).click();
          await page.getByTestId('scene-3d-canvas').waitFor();
          await page.waitForTimeout(2500);
          console.log('3D_OK',await page.getByTestId('scene-3d-canvas').isVisible());
          if(errors.length)throw Error(errors.join('\n'));
          await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
          node /tmp/startup.cjs
