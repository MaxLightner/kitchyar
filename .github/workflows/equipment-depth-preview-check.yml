name: Fridge clearance and appliance preview regression
on:
  push:
    branches: [fix/equipment-depth-direct-selection-cooktop-thumbs-20261121]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run lint
      - name: Geometry and prior equipment regression
        run: bunx tsx --test src/cad/fridgePlacement.test.ts src/cad/cooktopMount.test.ts src/cad/equipmentFinishSync.test.ts src/cad/sceneEquipmentSwap.test.ts src/cad/kitchenOcclusion.test.ts
      - name: Production build
        run: bun run build
