name: Appliance model swap and finish sync regression
on:
  push:
    branches: [fix/equipment-finish-sync-oven-fast-swap-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Check JPEG encoder
        run: command -v ffmpeg
      - name: Typescript
        run: bun run lint
      - name: Regression tests
        run: bunx tsx --test src/cad/equipmentFinishSync.test.ts src/cad/sceneEquipmentSwap.test.ts src/cad/kitchenOcclusion.test.ts src/cad/cooktopMount.test.ts
      - name: Build
        run: bun run build
