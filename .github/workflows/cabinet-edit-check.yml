name: Check cabinet editing
on: push
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run lint
        continue-on-error: true
      - run: bun x tsx --test src/cad/cabinetPlacement.test.ts src/cad/cadLogic.test.ts src/cad/smartKitchenSolver.test.ts
        continue-on-error: true
