name: Surface-mounted cooktop verification (temporary)
on:
  push:
    branches: [fix/cooktop-on-stone-20261120]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/unpack-appliances.mjs
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsx --test src/cad/cooktopMount.test.ts src/cad/countertopGeometry.test.ts
      - name: Build and bundle site
        run: bun run build
