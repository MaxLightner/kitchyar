name: Apply Gemini Kitchyar update in existing designer

on:
  push:
    branches: [main]
    paths:
      - '.github/import/kitchyar-2026-11-16/**'
      - '.github/workflows/import-kitchyar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Kitchyar
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Rebuild and apply reviewed designer source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, lzma, tarfile
          directory = Path(".github/import/kitchyar-2026-11-16")
          pieces = sorted(directory.glob("part-*.txt"))
          assert len(pieces) == 27, f"Expected 27 archive chunks; found {len(pieces)}"
          encoded = "".join(part.read_text().strip() for part in pieces)
          packed = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(packed).hexdigest()
          assert digest == "fe8ab03364b440b51422af53c2165cdcabe9ca96baccb46f5f307eab9b267984", digest
          tar_bytes = lzma.decompress(packed)
          with tarfile.open(fileobj=io.BytesIO(tar_bytes)) as archive:
              for member in archive.getmembers():
                  p = Path(member.name)
                  if (not member.isfile() or p.is_absolute() or
                      ".." in p.parts or p.parts[:2] != ("apps", "designer") or
                      member.issym() or member.islnk()):
                      raise RuntimeError(f"Untrusted archive path: {member.name}")
              archive.extractall(".", filter="data")
          print(f"Applied {len(archive.getmembers())} designer files")
          PY

      - name: Commit update on existing main branch
        shell: bash
        run: |
          set -euo pipefail
          git add apps/designer
          if git diff --cached --quiet; then
            echo 'Gemini update already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(designer): apply Gemini kitchen CAD update'
          git push origin HEAD:main
