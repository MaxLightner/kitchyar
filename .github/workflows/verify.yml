name: Verify Kitchyar Web
on:
  push:
  pull_request:
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check

  designer:
    name: Verify merged CAD, 3D and AR designer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install designer dependencies
        working-directory: apps/designer
        run: bun install --frozen-lockfile
      - name: Typecheck merged designer
        working-directory: apps/designer
        run: bun run lint
      - name: CAD and solver regression tests
        working-directory: apps/designer
        run: bun run test
      - name: Verify production bundle
        working-directory: apps/designer
        run: bun run build
