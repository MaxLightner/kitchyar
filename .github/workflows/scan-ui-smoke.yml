name: Browser smoke — Chido floor scan from Welcome

on:
  push:
    branches: [main, 'fix/chido-scan-on-welcome-visibility-2026-11-16', 'fix/tablet-viewport-xr-startup-2026-11-16', 'fix/align-singleclick-real-chido-tracking-2026-11-16', 'fix/unified-xr-session-2026-11-16', 'fix/tablet-scan-entry-20261116']
    paths:
      - 'apps/designer/**'
      - '.github/workflows/scan-ui-smoke.yml'

jobs:
  welcome-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual designer
        working-directory: apps/designer
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run test
          bun run build
      - name: Install isolated browser test runtime
        run: |
          npm install --no-save --no-package-lock --prefix /tmp/kitchyar-smoke playwright@1.58.0
          /tmp/kitchyar-smoke/node_modules/.bin/playwright install chromium --with-deps
      - name: Exercise desktop gating and tablet launch failure in Chromium
        working-directory: apps/designer
        shell: bash
        run: |
          set -euo pipefail
          bun run preview --host 127.0.0.1 --port 4173 >/tmp/kitchyar-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node <<'JS'
          const { chromium } = require('/tmp/kitchyar-smoke/node_modules/playwright');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ headless:true, args:['--no-sandbox'] });
            const page = await browser.newPage({viewport:{width:1024,height:768}});
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
            assert.equal(await page.getByRole('button',{name:'اسکن کف AR'}).isDisabled(), true,
              'Desktop browser must not offer AR even at tablet viewport size');
            await page.goto('http://127.0.0.1:4173/?autostart=1', {waitUntil:'networkidle'});
            await page.getByRole('button',{name:'نمای سه‌بعدی',exact:true}).click();
            await page.getByTestId('scene-3d-canvas').waitFor({timeout:15000});
            assert.equal(await page.getByTestId('toggle-floor-scan-3d').isDisabled(),true);
            console.log('PASS: desktop AR disabled; normal 3D canvas available.');


            // A preflight result is advisory: the tap must reach requestSession.
            for (const profile of [
              {name:'Android negative preflight', probe:'false'},
              {name:'Android rejected preflight', probe:'reject'},
              {name:'Android pending preflight', probe:'pending'},
              {name:'Android desktop-site UA', probe:'false', desktopUA:true},
            ]) {
              const ctx = await browser.newContext({
                viewport:{width:1024,height:768}, hasTouch:true, isMobile:true,
                userAgent:profile.desktopUA
                  ? 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36'
                  : 'Mozilla/5.0 (Linux; Android 14; Tablet) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36'
              });
              await ctx.addInitScript(({probe}) => {
                Object.defineProperty(navigator,'platform',{configurable:true,value:'Linux aarch64'});
                window.__xrCalls=0;
                window.__xrActivation=[];
                Object.defineProperty(navigator,'xr',{configurable:true,value:{
                  isSessionSupported:()=>probe==='pending' ? new Promise(()=>{})
                    : probe==='reject' ? Promise.reject(new Error('preflight unavailable')) : Promise.resolve(false),
                  requestSession:()=>{
                    window.__xrCalls++;
                    window.__xrActivation.push(navigator.userActivation.isActive);
                    return Promise.reject(new DOMException('entry regression fixture','NotAllowedError'));
                  }
                }});
              },profile);
              const p=await ctx.newPage();
              p.on('pageerror', error => errors.push(error.message));
              for (const entry of ['welcome','new project','saved project','2d toolbar','3d toolbar']) {
                await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
                let button=p.getByRole('button',{name:'اسکن کف AR',exact:true});
                if(entry!=='welcome') {
                  await p.getByRole('button',{name:/پروژه‌های من/}).click();
                  if(entry==='new project') button=p.getByTestId('new-project-card').getByRole('button',{name:'اسکن کف',exact:true});
                  if(entry==='saved project') button=p.locator('article:not([data-testid="new-project-card"])').getByRole('button',{name:'اسکن کف',exact:true}).last();
                  if(entry==='2d toolbar'||entry==='3d toolbar') {
                    await p.getByTestId('new-project-card').getByRole('button',{name:entry==='2d toolbar'?'2D':'3D',exact:true}).click();
                    button=p.getByTestId('toggle-floor-scan-3d');
                  }
                }
                assert.equal(await button.isEnabled(),true,profile.name+' '+entry+' scan must accept a tap');
                await button.tap();
                await p.getByTestId('chido-floor-scan-readiness').waitFor({timeout:15000});
                await p.getByText(/entry regression fixture/).first().waitFor();
                assert.equal(await p.evaluate(()=>window.__xrCalls),1,entry+' launches one request');
                assert.equal(await p.evaluate(()=>window.__xrActivation.every(Boolean)),true,'XR request retains tap activation');
                const retry=p.getByTestId('chido-start-camera');
                assert.equal(await retry.isEnabled(),true,'preflight must not disable retry');
                await retry.tap();
                await p.waitForFunction(()=>window.__xrCalls===2);
              }
              await ctx.close();
              console.log('PASS: all scan entry taps and retry — '+profile.name);
            }

            const tablet = await browser.newPage({
              viewport:{width:1024,height:768}, hasTouch:true,
              userAgent:'Mozilla/5.0 (Linux; Android 14; Tablet) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36'
            });
            tablet.on('pageerror', error => errors.push(error.message));
            await tablet.addInitScript(() => {
              window.__xrCalls=0;
              Object.defineProperty(navigator,'xr',{configurable:true,value:{
                isSessionSupported:async()=>true,
                requestSession:()=>{ window.__xrCalls++; return new Promise((resolve,reject)=>{window.__rejectXR=reject;}); }
              }});
            });
            await tablet.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
            await tablet.getByRole('button',{name:'اسکن کف AR'}).click();
            const scanner=tablet.getByTestId('chido-floor-scan-readiness');
            await scanner.waitFor({timeout:15000});
            assert.equal(await tablet.getByTestId('scene-3d-canvas').count(),0,
              'Do not allocate competing WebGL canvas while tracking');
            await tablet.getByTestId('toggle-floor-scan-3d').click();
            assert.equal(await tablet.evaluate(()=>window.__xrCalls),1,
              'Repeated camera tap must reuse pending request');
            await tablet.evaluate(()=>window.__rejectXR(new DOMException('fixture capability unavailable','NotSupportedError')));
            await tablet.getByText(/fixture capability unavailable/).first().waitFor();
            assert.equal(await scanner.isVisible(),true,'Failed launch remains visible with actual error');
            assert.equal(await tablet.getByText(/به‌صورت هم‌زمان پشتیبانی/).count(),0,
              'Do not invent a DOM-overlay conflict from NotSupportedError');
            await tablet.getByRole('button',{name:'شروع مجدد دوربین'}).click();
            assert.equal(await tablet.evaluate(()=>window.__xrCalls),2,'Failed request must allow explicit retry');
            await tablet.evaluate(()=>window.__rejectXR(new DOMException('fixture retry rejected','NotAllowedError')));
            await tablet.getByText(/fixture retry rejected/).first().waitFor();
            const scanLayers = await tablet.evaluate(() => ({
              ar: Number(getComputedStyle(document.querySelector('[data-testid="ar-workspace"]')).zIndex),
              scene: Number(getComputedStyle(document.querySelector('[data-testid="scene-3d-root"]')).zIndex)
            }));
            assert.ok(scanLayers.ar > scanLayers.scene);
            await tablet.close();
            console.log('PASS: supported tablet entry, single request, real failure diagnosis and retry.');

            async function assertDockVisible(width,height) {
              await page.setViewportSize({width,height});
              await page.waitForTimeout(250);
              const dock = await page.getByTestId('bottom-dock').boundingBox();
              const shell = await page.getByTestId('editor-shell').boundingBox();
              const visual = await page.evaluate(() => window.visualViewport?.height || window.innerHeight);
              assert.ok(dock && shell, 'Editor shell and bottom tools should exist');
              assert.ok(dock.height >= 90, 'Both tool rows must be present: '+JSON.stringify(dock));
              assert.ok(dock.y + dock.height <= visual + 2,
                'Bottom toolbar clipped by browser viewport: '+JSON.stringify({width,height,visual,dock,shell}));
              assert.ok(shell.height <= visual + 2,
                'Editor must fit dynamic visual viewport: '+JSON.stringify({width,height,visual,shell}));
            }
            await assertDockVisible(900,380);
            await assertDockVisible(390,650);
            console.log('PASS: Both bottom tool rows fit in regular tablet landscape and portrait browser view.');

            await page.setViewportSize({width:900,height:500});
            await page.getByTestId('toggle-fullscreen').click();
            await page.waitForFunction(() => Boolean(document.fullscreenElement),null,{timeout:5000});
            await page.waitForTimeout(200);
            const topPad = await page.getByTestId('editor-shell').evaluate(el=>parseFloat(getComputedStyle(el).paddingTop));
            assert.ok(topPad >= 28,'Fullscreen must reserve room for Android status bar/cutout: '+topPad);
            await page.getByTestId('toggle-fullscreen').click();
            await page.waitForFunction(() => !document.fullscreenElement,null,{timeout:5000});
            await assertDockVisible(900,500);
            console.log('PASS: Enter/exit fullscreen preserves safe area and bottom toolbar.');

            await page.getByTestId('go-welcome').click();
            await page.getByRole('button',{name:'اسکن کف AR'}).waitFor({timeout:10000});
            console.log('PASS: Home button returns directly to Welcome without losing project UI.');
            if(errors.length) throw Error('Browser errors: '+errors.join('; '));
            // Separate clean browser context: its default L kitchen has a
            // selected cabinet and a realistic group of doors/drawers.
            const designPage = await browser.newPage({viewport:{width:1100,height:740}});
            const designErrors=[];
            designPage.on('pageerror',err=>designErrors.push(err.message));
            await designPage.goto('http://127.0.0.1:4173/?autostart=1',{waitUntil:'networkidle'});
            const alignToolbar=designPage.getByTestId('selection-align-toolbar');
            await alignToolbar.waitFor({timeout:15000});
            const alignIds=await alignToolbar.locator('button[data-testid]').evaluateAll(
              buttons=>buttons.map(b=>b.getAttribute('data-testid'))
            );
            assert.deepEqual(alignIds,[
              'align-selected-left','align-selected-right','align-selected-center',
              'align-selected-vertical-widths','align-selected-horizontal-heights',
            ],'Exactly the five requested Align tools must remain');
            assert.equal(await designPage.getByTestId('align-selected-vertical-widths').isDisabled(),true,
              'Equal-width must require multiple selected vertical doors');
            assert.equal(await designPage.getByTestId('align-selected-horizontal-heights').isDisabled(),true,
              'Equal-height must require multiple selected drawer groups');
            await designPage.getByTestId('align-selected-center').click();
            assert.equal(designErrors.length,0,'Align actions must not crash browser: '+designErrors.join('; '));
            console.log('PASS: Exactly five Align tools appear, equal-size require multi-selection and center-click works.');
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
